plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "whips-and-giggles-${minecraft_version}"
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/.cache/**'
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        serverData {
            gameDirectory = file('run/server-data')
            serverData()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }
        data {
            gameDirectory = file('run/client-data')
            clientData()
            taskBefore tasks.named('runServerData')
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            neo_version: neo_version,
            minecraft_version: minecraft_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
